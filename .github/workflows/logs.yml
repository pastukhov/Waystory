name: Diagnostic logs
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Window length ending now or at end_utc'
        type: choice
        options: ['1', '6', '24', '72']
        default: '6'
      end_utc:
        description: 'Optional window end: YYYY-MM-DDTHH:mm:ssZ'
        type: string
      request_id:
        description: 'Optional request UUID'
        type: string
      place_id:
        description: 'Optional place ID, e.g. wiki:ru:3682050'
        type: string
permissions:
  contents: read
concurrency:
  group: waystory-diagnostic-logs
  cancel-in-progress: false
jobs:
  logs:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, waystory]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Prepare temporary output
        id: output
        shell: bash
        run: |
          directory="$(mktemp -d "$RUNNER_TEMP/waystory-logs.XXXXXX")"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - name: Query Loki from the private network
        env:
          LOKI_URL: ${{ secrets.LOKI_URL }}
          LOKI_SELECTOR: ${{ vars.LOKI_SELECTOR }}
          LOKI_BEARER_TOKEN: ${{ secrets.LOKI_BEARER_TOKEN }}
          LOKI_USERNAME: ${{ secrets.LOKI_USERNAME }}
          LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}
          LOKI_TENANT_ID: ${{ secrets.LOKI_TENANT_ID }}
          LOG_HOURS: ${{ inputs.hours }}
          LOG_END: ${{ inputs.end_utc }}
          LOG_REQUEST_ID: ${{ inputs.request_id }}
          LOG_PLACE_ID: ${{ inputs.place_id }}
          LOG_OUTPUT_DIR: ${{ steps.output.outputs.directory }}
        run: node scripts/loki-logs.mjs
      - name: Upload diagnostic report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: waystory-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.output.outputs.directory }}
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary output
        if: always() && steps.output.outputs.directory != ''
        env:
          REPORT_DIRECTORY: ${{ steps.output.outputs.directory }}
        run: rm -rf -- "$REPORT_DIRECTORY"

name: Codex Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    name: Wait for Codex review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Mark the PR head check pending
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD" \
            -f context='Codex review complete' -f state=pending \
            -f description='Waiting for Codex review and resolution' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      # This workflow holds a write token. Only run code from the trusted base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Wait for review and resolution
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-codex-review.mjs
      - name: Publish the PR head result
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          description='Review gate failed. See the workflow log.'
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Codex review completed and findings resolved'
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD" \
            -f context='Codex review complete' -f state="$state" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null

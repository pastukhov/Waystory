# Loaded inside the existing Nginx http {} block.
# Install only after issuing the certificate. HTTP ACME challenges continue
# to be served by dogovorovoi's existing port 80 server.
server {
    listen 443 ssl;
    http2 on;
    server_name ws.nayg.ru;
    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/ws.nayg.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.nayg.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)" always;

    # Resolve on requests, allowing independent app restarts and new IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $waystory_backend http://waystory-app:5173;
        proxy_pass $waystory_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

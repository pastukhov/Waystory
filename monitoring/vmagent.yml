# Merge this job into existing vmagent/Prometheus configuration.
# Replace the target with an address reachable from your monitoring network.
# Keep the token file outside git; it must match Waystory's METRICS_TOKEN.
scrape_configs:
  - job_name: waystory
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/vmagent/secrets/waystory-metrics-token
    static_configs:
      - targets: ['ws.nayg.ru']

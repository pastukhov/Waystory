services:
  waystory:
    image: ${WAYSTORY_IMAGE:-waystory:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${WAYSTORY_ENV_FILE:-/opt/waystory/.env}
    environment:
      NODE_ENV: production
      WAYSTORY_REVISION: ${WAYSTORY_IMAGE:-waystory:local}
      HOST: 0.0.0.0
      PORT: "5173"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    restart: unless-stopped
    volumes:
      - waystory-data:/app/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      proxy:
        aliases: [waystory-app]

networks:
  proxy:
    external: true
    name: ${WAYSTORY_PROXY_NETWORK:-dogovorovoi_default}

volumes:
  waystory-data:
